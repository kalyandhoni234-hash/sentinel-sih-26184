# SENTINEL Synthetic Data Generation Configuration
# This file controls the behavior of the synthetic data generator.
# All parameters are for synthetic data only.
#
# Scale note (dataset v0.2.0): the corpus covers 47 synthetic city metros
# across 21 Indian states/UTs. Case origins are distributed deterministically
# by tier weight (see geography.origin_tier_weights): Tier-1 cities receive
# the most cases, Tier-3 cities a meaningful share — no single city dominates.
# Coordinates are approximate real city centers used ONLY to give the
# synthetic world realistic inter-city distances. They are NOT claims about
# real crime geography, and no real-world intelligence fields exist in the
# generator.

generation:
  random_seed: 42
  dataset_version: "0.2.0"
  generator_version: "0.2.0"
  schema_version: "0.1.0"
  case_count: 5000
  # Complaint times are spread deterministically over this window (days).
  complaint_window_days: 365

geography:
  # Synthetic metro areas. `tier` drives origin weighting; `state` is used
  # for dataset-level state/region distribution reporting (the Case schema
  # itself carries only origin_metro — no new case fields were introduced).
  # Tier-1: 8 metros x 12 locations, Tier-2: 16 x 8, Tier-3: 23 x 7 = 385 locations.
  origin_tier_weights:
    tier1: 3.0
    tier2: 1.6
    tier3: 1.0

