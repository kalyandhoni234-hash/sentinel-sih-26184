scenarios:
  weights:
    DIRECT_CASHOUT: 0.20
    RAPID_MULE_CHAIN: 0.15
    MULTI_HOP: 0.15
    GEOGRAPHIC_JUMP: 0.15
    DELAYED_CASHOUT: 0.10
    URBAN_CLUSTER: 0.15
    DISPERSED_ACTIVITY: 0.10

transactions:
  # Amount ranges in INR (synthetic). Amounts are drawn from a lognormal
  # distribution (heavy right tail — many mid-size complaints, few very large
  # ones) and clipped to [min_amount, max_amount].
  min_amount: 2000
  max_amount: 450000
  amount_lognormal:
    mu: 10.6   # ln-scale median ~ ₹40,000
    sigma: 1.05
  # Hop count ranges per scenario
  hop_counts:
    DIRECT_CASHOUT: [1, 2]
    RAPID_MULE_CHAIN: [3, 4]
    MULTI_HOP: [4, 6]
    GEOGRAPHIC_JUMP: [2, 4]
    DELAYED_CASHOUT: [2, 3]
    URBAN_CLUSTER: [2, 4]
    DISPERSED_ACTIVITY: [3, 5]

candidates:
  min_per_case: 10
  max_per_case: 18

evaluation:
  test_size: 0.2
  random_seed: 42
